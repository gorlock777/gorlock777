<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="100%" height="100%">
  <defs>
    <!-- Rich deep background: warm obsidian to deep petroleum slate -->
    <linearGradient id="deepCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d12"/>
      <stop offset="60%" stop-color="#0e141d"/>
      <stop offset="100%" stop-color="#141a24"/>
    </linearGradient>

    <!-- Bold intentional accent gradients: Electric Amber/Tangerine & Deep Glacier Blue -->
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff7849" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#ea580c" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glacierGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>

    <!-- Asymmetric subtle frosted glass surface -->
    <linearGradient id="asymGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01"/>
    </linearGradient>

    <linearGradient id="subtleRim" x1="0%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ff7849" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>

    <!-- Deep Ambient Glow Filter -->
    <filter id="ambientBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap');

      .bg-orb-amber {
        animation: floatAmber 14s ease-in-out infinite alternate;
      }
      .bg-orb-glacier {
        animation: floatGlacier 18s ease-in-out infinite alternate;
      }

      @keyframes floatAmber {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-40px, 25px) scale(1.15); }
      }
      @keyframes floatGlacier {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(45px, -20px) scale(0.9); }
      }

      .hero-title {
        font-family: 'Space Grotesk', -apple-system, sans-serif;
        font-weight: 700;
        letter-spacing: -1.8px;
        fill: #f8fafc;
      }
      .accent-name {
        fill: #ff7849;
      }
      .editorial-sub {
        font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
        font-weight: 400;
        font-size: 15px;
        letter-spacing: -0.2px;
        fill: #94a3b8;
      }
      .meta-tagline {
        font-family: 'Space Grotesk', monospace;
        font-weight: 500;
        font-size: 12px;
        letter-spacing: 2px;
        text-transform: uppercase;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Deep Canvas Base -->
  <rect width="960" height="250" rx="14" fill="url(#deepCanvas)" />

  <!-- Organic Background Light Fields (No harsh grids, pure atmospheric glass refraction) -->
  <g filter="url(#ambientBlur)">
    <circle cx="260" cy="180" r="160" fill="url(#glacierGlow)" class="bg-orb-glacier" />
    <circle cx="780" cy="90" r="180" fill="url(#amberGlow)" class="bg-orb-amber" />
  </g>

  <!-- Asymmetric Glass Surface: Offset, generous breathing space, razor-thin highlight rim -->
  <rect x="40" y="32" width="880" height="186" rx="16" fill="url(#asymGlass)" stroke="url(#subtleRim)" stroke-width="1" />

  <!-- Layout: Left-aligned, high-contrast scale, generous whitespace -->
  <g transform="translate(85, 82)">
    <!-- Small uppercase editorial category marker -->
    <text x="0" y="0" class="meta-tagline">Systems &amp; Architecture</text>

    <!-- Bold Display Title -->
    <text x="0" y="48" class="hero-title" font-size="44">
      Hi, I am <tspan class="accent-name">gorlock777</tspan>.
    </text>

    <!-- Subtitle with real weight contrast and natural tone -->
    <text x="0" y="86" class="editorial-sub">
      Engineering resilient backends, distributed systems, and modern web infrastructure.
    </text>
  </g>

  <!-- Clean asymmetric accent detail: Geometric line indicator on right edge -->
  <line x1="840" y1="75" x2="840" y2="175" stroke="#ff7849" stroke-opacity="0.3" stroke-width="1.5" />
  <circle cx="840" cy="75" r="2.5" fill="#ff7849" fill-opacity="0.8" />
</svg>
